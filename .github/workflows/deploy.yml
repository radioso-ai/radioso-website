name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-run from the Actions tab. The push trigger has silently failed to fire
  # before, leaving main deployed but stale with no way to retry short of another
  # commit; this is that retry. Dispatching from main goes live, from any other
  # branch it lands on a preview channel — same rule as the channelId below.
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: live
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      # Deploys a preview channel on pull requests, and live on push to main.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: radioso-live
          channelId: ${{ github.ref == 'refs/heads/main' && 'live' || '' }}
