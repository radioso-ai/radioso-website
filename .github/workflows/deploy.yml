name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-run from the Actions tab. The push trigger has silently failed to fire
  # before, leaving main deployed but stale with no way to retry short of another
  # commit; this is that retry. Dispatching from main goes live, from any other
  # branch it lands on a preview channel — same rule as the channelId below.
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: live
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      # Deploys a preview channel on pull requests, and live on push to main.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: radioso-live
          channelId: ${{ github.ref == 'refs/heads/main' && 'live' || '' }}
          # 15.34.1 checks serviceusage.services.get on radioso-live, which the
          # deploy service account doesn't hold; every deploy 403s with it.
          firebaseToolsVersion: 15.34.0

      # Live deploys only: the agent on radioso.ai answers price questions from this
      # document, so it follows the page that just went out. Skips with a notice while
      # RADIOSO_DOCS_API_TOKEN is unset (the same workspace token the radioso repo's
      # docs sync uses).
      - name: Sync pricing into the agent's workspace
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node scripts/sync-pricing-to-radioso.mjs
        env:
          RADIOSO_API_TOKEN: ${{ secrets.RADIOSO_DOCS_API_TOKEN }}
